<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strands Assistant</title>
    <!-- Modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --chat-bg: #1a1d24;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --user-msg: #2563eb;
            --agent-msg: #2d3748;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(26, 29, 36, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.agent {
            background-color: var(--agent-msg);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            /* Allow markdown code blocks to scroll */
            overflow-x: auto;
        }

        /* Basic Markdown styling */
        .message.agent pre {
            background: #0f1115;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .message.agent code {
            font-family: monospace;
            background: #0f1115;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .input-area {
            padding: 20px;
            background: var(--chat-bg);
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 12px;
            background: #0f1115;
            padding: 8px;
            border-radius: 24px;
            border: 1px solid var(--border);
            transition: border-color 0.2s ease;
        }

        .input-container:focus-within {
            border-color: var(--primary);
        }

        input[type="text"] {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 8px 16px;
            font-size: 1rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--agent-msg);
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            color: var(--text-muted);
            font-size: 0.9rem;
            align-items: center;
            gap: 4px;
        }

        .typing-indicator span {
            width: 4px;
            height: 4px;
            background-color: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Strands Assistant</h1>
        </header>

        <div class="chat-box" id="chat-box">
            <!-- Chat messages will appear here -->
            <div class="message agent">Hello! I am your Strands Agent. How can I help you today?</div>
            
            <div class="typing-indicator" id="typing-indicator">
                Thinking<span></span><span></span><span></span>
            </div>
        </div>

        <div class="input-area">
            <form id="chat-form">
                <div class="input-container">
                    <input type="text" id="message-input" placeholder="Ask something..." autocomplete="off">
                    <button type="submit" id="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // Simple Markdown parser for basic formatting (bold, code, links)
        function parseMarkdown(text) {
            let html = text
                // Escape HTML tags to prevent XSS
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                // Code blocks
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Bold
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                // Links
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color: #60a5fa;">$1</a>')
                // Newlines to <br>
                .replace(/\n/g, '<br>');
            return html;
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            
            if (sender === 'agent') {
                div.innerHTML = parseMarkdown(text);
            } else {
                // User messages are just plain text
                div.textContent = text;
            }
            
            // Insert before typing indicator
            chatBox.insertBefore(div, typingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                typingIndicator.style.display = 'flex';
                sendBtn.disabled = true;
                messageInput.disabled = true;
            } else {
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
            scrollToBottom();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            // 1. Show user message
            appendMessage('user', message);
            messageInput.value = '';
            
            // 2. Show loading
            setLoading(true);

            // 3. Call API
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Server error');
                }

                // 4. Show agent message
                appendMessage('agent', data.response);

            } catch (error) {
                appendMessage('agent', `**Error:** ${error.message}`);
            } finally {
                setLoading(false);
            }
        });

        // Focus input on load
        window.onload = () => messageInput.focus();
    </script>
</body>
</html>
