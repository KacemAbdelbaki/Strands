[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-assistant"
version = "0.1.0"
description = "A free-tier personal AI assistant built with Strands Agents"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[gemini,litellm,ollama]>=1.61",
    "strands-agents-tools",
    "mem0ai",
    "chromadb",
    "google-api-python-client",
    "google-auth-oauthlib",
    "python-dotenv",
]

[project.optional-dependencies]
web = []
dev = ["pytest>=8"]

[project.scripts]
strands-assistant = "strands_assistant.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
